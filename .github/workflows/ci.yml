name: CI

on:
  pull_request:
  push:
    branches:
      - feat/webapp-v0

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile on branch push
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: lock Sites dependencies'
          git push origin HEAD:feat/webapp-v0
      - name: Run tests
        run: npm test
      - name: Build ChatGPT Sites artifact
        run: npm run build
      - name: Verify Sites artifact
        run: |
          test -f dist/server/index.js
          test -f dist/.openai/hosting.json
      - name: Check tracked source for populated Miro secrets
        run: |
          if git grep -nE 'MIRO_ACCESS_TOKEN=[^[:space:]]+|MIRO_BOARD_ID=[^[:space:]]+|Bearer [A-Za-z0-9._-]{20,}' -- ':!.github/workflows/ci.yml' ':!docs/superpowers/**'; then
            echo 'Potential committed credential found.'
            exit 1
          fi
