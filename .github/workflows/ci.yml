name: CI

on:
  pull_request:
  push:
    branches:
      - feat/webapp-v0

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Run tests
        run: npm test
      - name: Build ChatGPT Sites artifact
        run: npm run build
      - name: Verify Sites artifact
        run: |
          test -f dist/server/index.js
          test -f dist/.openai/hosting.json
      - name: Check tracked source for populated Miro secrets
        run: |
          if git grep -nE 'MIRO_ACCESS_TOKEN=[^[:space:]]+|MIRO_BOARD_ID=[^[:space:]]+|Bearer [A-Za-z0-9._-]{20,}' -- ':!docs/superpowers/**'; then
            echo 'Potential committed credential found.'
            exit 1
          fi
